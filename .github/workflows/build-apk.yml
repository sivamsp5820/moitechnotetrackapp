name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.4)'
        required: false
        default: 'v1.0.4'

jobs:
  build:
    name: Build & Assemble Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoiNoteTracker-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v1.0.4' }}
          name: "Moi Note Tracker Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v1.0.4' }}"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
          body: |
            ### Moi Note Tracker - Native Android Release
            
            - **Theme**: Premium Monochrome Matte Dark (#0A0A0A)
            - **Platform**: Pure Native Android (Kotlin + Jetpack Compose + Material 3)
            - **Sync**: Aiven Cloud MySQL integration with automatic hostname sync
            - **Features**:
              - Real-time workflow checklists: Typed, Print, Given for Binding, Given to Customer
              - 1-Tap Customer Phone Dialer & WhatsApp Messaging
              - PC Nickname Mapping
              - Offline caching with auto-resync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
